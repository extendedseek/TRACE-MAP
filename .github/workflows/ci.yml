name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and test tools
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke pipeline
        run: trace-map smoke --config configs/smoke.yaml --output /tmp/trace-map-smoke
      - name: Build package
        run: python -m build
