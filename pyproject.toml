[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-map"
version = "0.1.0"
description = "Trust-aware attribution and counterfactual credibility for language-guided multi-agent economic policy learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Nasser A. Alsadhan", email = "nsadhan@ksu.edu.sa" },
]
keywords = [
  "multi-agent reinforcement learning",
  "economic policy",
  "large language models",
  "strategic communication",
  "opponent modeling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
train = [
  "torch>=2.2,<3",
  "tqdm>=4.66,<5",
]
language = [
  "transformers>=4.51,<5",
  "sentence-transformers>=3.0,<6",
  "accelerate>=0.30,<2",
]
taxai = [
  "omegaconf>=2.3,<3",
  "gym==0.26.2",
  "pygame>=2.5,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "quantecon>=0.7,<1",
  "matplotlib>=3.7,<4",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "build>=1.2,<2",
]
[project.scripts]
trace-map = "trace_map.cli:main"

[project.urls]
Documentation = "https://github.com/OWNER/TRACE-MAP#readme"
Repository = "https://github.com/OWNER/TRACE-MAP"
Issues = "https://github.com/OWNER/TRACE-MAP/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
trace_map = ["prompts.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "requires_torch: tests requiring the optional PyTorch dependency",
  "requires_taxai: tests requiring the external TaxAI checkout",
]

[tool.coverage.run]
source = ["trace_map"]
omit = ["src/trace_map/models/*", "src/trace_map/language/hf_backend.py"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
exclude = "third_party/"
